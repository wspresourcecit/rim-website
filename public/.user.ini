; PHP overrides for production (PHP-FPM / CGI reads this file per-directory).
; Keep in sync with the CMS upload limits. Values chosen to comfortably fit
; base64-encoded images (~33% overhead) plus long-form CMS content in one request.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_input_vars = 5000
max_file_uploads = 30
